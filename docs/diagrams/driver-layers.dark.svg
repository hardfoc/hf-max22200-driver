<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">Three layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: the application calls the hardware-agnostic MAX22200 driver, which uses the CRTP SPI interface, which calls the platform port you write, which drives the SPI bus and the ENABLE, CMD and FAULT pins of the MAX22200.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="874" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Three layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">The driver and the interface are the same on every MCU. The port is a small class you write once.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#252F3C"/>
<rect x="32" y="278.4" width="1136" height="123" rx="16" fill="#1C1F3D" stroke="#3B4080" stroke-width="1.2"/>
<path d="M600 242.4 L600 274.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 405.4 L600 437.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 559.4 L600 591.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 687.4 L600 719.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<rect x="32" y="441.4" width="1136" height="114" rx="12" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<rect x="32" y="449.4" width="4" height="98" rx="2" fill="#8C93FF"/>
<rect x="32" y="595.4" width="1136" height="88" rx="12" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<rect x="32" y="603.4" width="4" height="72" rx="2" fill="#2DD4BF"/>
<rect x="32" y="723.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="731.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">valve sequencing, relay control, motor direction ...</text>
<rect x="48" y="323.4" width="98.4" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">Initialize()</text>
<rect x="154.4" y="323.4" width="180.7" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="162.4" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">ConfigureChannel()</text>
<rect x="343.1" y="323.4" width="153.7" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="351.1" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">EnableChannel()</text>
<rect x="504.7" y="323.4" width="158.1" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="512.7" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SetChannelsOn()</text>
<rect x="670.8" y="323.4" width="183.6" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="678.8" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SetFullBridgeState()</text>
<rect x="862.4" y="323.4" width="184" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="870.4" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SetHoldCurrentMa()</text>
<rect x="48" y="357.4" width="124" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadStatus()</text>
<rect x="180" y="357.4" width="181" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="188" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadFaultRegister()</text>
<rect x="369" y="357.4" width="192.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="377" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ClearChannelFaults()</text>
<rect x="569.2" y="357.4" width="150.3" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="577.2" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ConfigureDpm()</text>
<rect x="727.6" y="357.4" width="161.5" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="735.6" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">ReadRegister32()</text>
<rect x="897" y="357.4" width="96.6" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="905" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">+42 more</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">MAX22200&lt;SpiType&gt;, inc/max22200.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="507" font-size="17" fill="#D2DAE4">SpiInterface&lt;Derived&gt;: CRTP base. Command byte with CMD high, then 8 or 32 data bits</text>
<text x="56" y="531.7" font-size="17" fill="#D2DAE4">with CMD low; ENABLE, CMD and FAULT by name (CtrlPin) and state (GpioSignal)</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Initialize()  Transfer()  SetChipSelect()  Configure()  IsReady()  DelayUs()  GpioSet()  GpioRead()</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#E8EDF3">MAX22200</text>
<text x="56" y="789" font-size="17" fill="#D2DAE4">SPI mode 0 up to 10 MHz  /  ENABLE, CMD, FAULT  /  OUT0 to OUT7, up to 36 V, 1 A RMS</text>
<rect x="32" y="824.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<text x="54" y="839.4" font-size="16" fill="#9AA6B5">this library</text>
<rect x="161.8" y="824.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="183.8" y="839.4" font-size="16" fill="#9AA6B5">you write</text>
<rect x="282.1" y="824.8" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="839.4" font-size="16" fill="#9AA6B5">hardware</text>
</svg>
